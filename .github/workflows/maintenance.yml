name: Maintenance

# One-off database jobs inside the running fbedb pod (fixes, and read-only checks). Startable from the Actions tab or from a
# Claude session through the GitHub API.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        options: [unlink-overlinked, list-pending, approve, reject]
        default: unlink-overlinked
      max_pages:
        description: "unlink-overlinked: events linked to more Pages than this lose their Page links"
        type: number
        default: 5
      page_url:
        description: "approve / reject: the suggested Page's address (see list-pending)"
        type: string
        default: ""
      reason:
        description: "reject: why (optional)"
        type: string
        default: ""
      dry_run:
        description: "Dry run: only list what would change"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run it in the fbedb pod
        env:
          TASK: ${{ inputs.task }}
          MAX_PAGES: ${{ inputs.max_pages }}
          DRY_RUN: ${{ inputs.dry_run }}
          PAGE_URL: ${{ inputs.page_url }}
          REASON: ${{ inputs.reason }}
        run: |
          flag=""
          [ "$DRY_RUN" = "true" ] && flag="--dry-run"
          case "$TASK" in
            list-pending) set -- ;;                       # read-only, no arguments
            approve) set -- "$PAGE_URL" ;;
            reject) set -- "$PAGE_URL" "$REASON" ;;
            *) set -- "$MAX_PAGES" "$flag" ;;
          esac
          ssh debian@${{ secrets.VPS_HOST }} "KUBECONFIG=\$HOME/.kube/config kubectl exec deploy/fbedb -- \
            node --disable-warning=ExperimentalWarning maintenance.js $(printf '%q ' "$TASK" "$@")"
